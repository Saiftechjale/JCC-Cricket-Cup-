name: Build Jale Cricket Studio Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Add Capacitor Android Platform & Sync
        run: |
          npm install --no-save @capacitor/cli@^8.0.0 @capacitor/android@^8.0.0 --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Build Installable Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Upload Installable APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jale-Cricket-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
