<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="50%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#07111E" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.85" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="10 8" opacity="0.5" />
  <!-- Stumps -->
  <rect x="218" y="138" width="12" height="168" rx="4" fill="url(#gold)" />
  <rect x="250" y="138" width="12" height="168" rx="4" fill="url(#gold)" />
  <rect x="282" y="138" width="12" height="168" rx="4" fill="url(#gold)" />
  <rect x="214" y="126" width="38" height="9" rx="3" fill="#FFFBEB" />
  <rect x="260" y="126" width="38" height="9" rx="3" fill="#FFFBEB" />
  <!-- Crossed Cricket Bat -->
  <g transform="rotate(-32 256 256)">
    <rect x="242" y="96" width="28" height="205" rx="6" fill="url(#gold)" stroke="#78350F" stroke-width="3" />
    <rect x="249" y="298" width="14" height="95" rx="5" fill="#F8FAFC" stroke="#1E293B" stroke-width="2" />
  </g>
  <!-- Cricket Ball -->
  <circle cx="256" cy="250" r="42" fill="url(#crimson)" stroke="url(#gold)" stroke-width="4" />
  <path d="M 226 220 Q 256 250 286 280" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-dasharray="5 4" />
  <!-- Banner Ribbon -->
  <rect x="96" y="346" width="320" height="54" rx="12" fill="url(#gold)" />
  <text x="256" y="382" font-family="sans-serif" font-weight="900" font-size="30" fill="#0B192C" text-anchor="middle" letter-spacing="2">JALE CRICKET</text>
</svg>
